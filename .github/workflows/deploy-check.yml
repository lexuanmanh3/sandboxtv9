name: Deploy Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  critical-files:
    name: Verify critical deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check critical files exist
        run: |
          MISSING=0
          for file in "public/index.php" "public/.htaccess" ".htaccess" "server.php"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing critical file: $file — site will 404 on Hostinger/Apache"
              MISSING=1
            else
              echo "[OK] $file"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "These files are required for Laravel on Apache/Hostinger."
            echo "Do NOT delete them. Use Edit to modify content only."
            exit 1
          fi
          echo ""
          echo "All critical files present."
